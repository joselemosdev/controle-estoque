<div class="modal-container">
    <div class="modal-header">
        @if (data.action == 'delete') {
        <p id="title">Exclusão de {{title}}</p>
        } @else {
        <p id="title">Cadastro de {{title}}</p>
        }
        <button id="close" (click)="closeModal()" class="btn-close"> <fa-icon [icon]="faXmark"></fa-icon></button>
    </div>
    @if (this.data.action == 'delete') {
    <p id="delete-massage">Deseja excluir este registro?</p>
    }
    <div class="modal-content">
        @for (item of itemFields; track item[0]) {
        <mat-form-field class="col-md-6" class="itemField">
            <mat-label id="label"><b>{{item[0]}}</b></mat-label>
            <input matInput [id]="item[0]" [disabled]="isReadOnly || item[0] == 'ID'" [value]="item[1]">
        </mat-form-field>
        }
    </div>
    <div class="modal-footer">
        <button id="cancel" (click)="cancel()" class="btn-footer">Cancelar</button>
        @if (data.action == 'delete') {
        <button id="delete" (click)="confirmDelete()" class="btn-footer">Excluir</button>
        } @else if(data.action != 'view') {
        <button id="confirm" (click)="confirmSave()" class="btn-footer">Salvar</button>
        }
    </div>
</div>
